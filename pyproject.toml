[project]
name = "spiky-dance"
version = "0.1.0"
description = "Event-camera simulation and spiking-network unusualness scores for dance clips"
requires-python = ">=3.12,<3.13"
dependencies = [
    "eventify-dvs>=0.2.0",
    "numpy>=2.4.6",
    "opencv-python>=4.10",
    "snntorch==1.0.0",
    "torch==2.12.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
